name: Port build
on:
  push:
    branches: ['1.21.1', '26.3']
  pull_request:
    branches: ['1.21.1', '26.3']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: python .github/scripts/validate_progression.py
      - run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: magneticraft-1.21.1-bootstrap
          path: build/libs/*.jar
          if-no-files-found: error
