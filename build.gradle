plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
version = mod_version
group = mod_group_id
base { archivesName = "Foundations-Magneticraft-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
// Legacy source/assets stay in history for reference; only migrated content is packaged.
sourceSets.main {
    java.setSrcDirs(['port/src/main/java'])
    resources.setSrcDirs(['port/src/main/resources'])
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { magneticraft { sourceSet(sourceSets.main) } }
}
tasks.named('processResources', ProcessResources) {
    def properties = [mod_version: mod_version, neo_version: neo_version,
                      minecraft_version_range: minecraft_version_range]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { from('LICENSE') }

// Standalone assertion program; use a dedicated source set rather than a JUnit test task.
sourceSets {
    crushingChecks {
        java.setSrcDirs(['port/src/test/java'])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('verifyCrushing', JavaExec) {
    dependsOn tasks.named('crushingChecksClasses')
    classpath = sourceSets.crushingChecks.runtimeClasspath
    mainClass = 'com.foundations.magneticraft.manual.CrushingProgressTest'
}
tasks.named('check') { dependsOn tasks.named('verifyCrushing') }

tasks.register('verifySluice', JavaExec) {
    dependsOn tasks.named('crushingChecksClasses')
    classpath = sourceSets.crushingChecks.runtimeClasspath
    mainClass = 'com.foundations.magneticraft.manual.SluiceCycleTest'
}
tasks.named('check') { dependsOn tasks.named('verifySluice') }

tasks.register('verifyScriptRecipes', JavaExec) {
    dependsOn tasks.named('crushingChecksClasses')
    classpath = sourceSets.crushingChecks.runtimeClasspath
    mainClass = 'com.foundations.magneticraft.integration.RecipeOverridesTest'
}
tasks.named('check') { dependsOn tasks.named('verifyScriptRecipes') }

tasks.register('verifyFabricator', JavaExec) {
    dependsOn tasks.named('crushingChecksClasses')
    classpath = sourceSets.crushingChecks.runtimeClasspath
    mainClass = 'com.foundations.magneticraft.manual.FabricatorPlannerTest'
}
tasks.named('check') { dependsOn tasks.named('verifyFabricator') }

tasks.register('verifyRecipeCache', JavaExec) {
    dependsOn tasks.named('crushingChecksClasses')
    classpath = sourceSets.crushingChecks.runtimeClasspath
    mainClass = 'com.foundations.magneticraft.integration.GenerationCacheTest'
}
tasks.named('check') { dependsOn tasks.named('verifyRecipeCache') }

tasks.register('verifyWaterBudget', JavaExec) {
    dependsOn tasks.named('crushingChecksClasses')
    classpath = sourceSets.crushingChecks.runtimeClasspath
    mainClass = 'com.foundations.magneticraft.manual.WaterBudgetTest'
}
tasks.named('check') { dependsOn tasks.named('verifyWaterBudget') }

repositories { maven { url = 'https://api.modrinth.com/maven' }; maven { url = 'https://maven.blamejared.com' } }
dependencies {
    compileOnly 'mezz.jei:jei-26.3-common-api:31.9.0.58'
    compileOnly 'mezz.jei:jei-26.3-neoforge-api:31.9.0.58'
    compileOnly 'maven.modrinth:jade:26.3.5+neoforge'
    crushingChecksImplementation 'com.google.code.gson:gson:2.11.0'
}
tasks.register('verifyRecipeCatalog', JavaExec) {
    dependsOn tasks.named('crushingChecksClasses')
    classpath = sourceSets.crushingChecks.runtimeClasspath
    mainClass = 'com.foundations.magneticraft.integration.ProcessingCatalogTest'
}
tasks.named('check') { dependsOn tasks.named('verifyRecipeCatalog') }

tasks.register('verifySluiceWaterSupply', JavaExec) {
    dependsOn tasks.named('crushingChecksClasses')
    classpath = sourceSets.crushingChecks.runtimeClasspath
    mainClass = 'com.foundations.magneticraft.manual.SluiceWaterSupplyTest'
}
tasks.named('check') { dependsOn tasks.named('verifySluiceWaterSupply') }
