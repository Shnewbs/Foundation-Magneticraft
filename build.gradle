plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = "Foundations-Magneticraft-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
// Legacy source/assets stay in history for reference; only migrated content is packaged.
sourceSets.main {
    java.setSrcDirs(['port/src/main/java'])
    resources.setSrcDirs(['port/src/main/resources'])
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { magneticraft { sourceSet(sourceSets.main) } }
}
tasks.named('processResources', ProcessResources) {
    def properties = [mod_version: mod_version, neo_version: neo_version,
                      minecraft_version_range: minecraft_version_range]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { from('LICENSE') }
